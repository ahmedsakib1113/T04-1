<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T04 – SVG House &amp; Garden</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 880px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #222;
    background: #fafafa;
  }

  h1 {
    font-size: 1.5rem;
  }

  figure {
    margin: 0 0 2rem 0;
  }

  figcaption {
    margin-top: 0.5rem;
    font-size: 0.95rem;
    color: #555;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #ffffff;
  }

  #scene-annotated #annotations {
    font-size: 12px;
    fill: #333;
    stroke: #999;
    stroke-width: 1;
    pointer-events: none;
  }

  #scene-annotated #annotations text {
    stroke: none;
  }
</style>
</head>
<body>
  <h1>T04 – SVG House &amp; Garden</h1>

  <figure id="scene-original-figure">
    <svg id="scene-original" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="svgTitleOriginal svgDescOriginal">
      <title id="svgTitleOriginal">House and garden scene</title>
      <desc id="svgDescOriginal">An illustrated house with a garden: sky, grass, sun, cloud, tree, house with roof, chimney, door and windows, a picket fence, a curved path, and a welcome caption.</desc>

      <!-- sky and grass -->
      <rect x="0" y="0" width="800" height="340" fill="#87CEEB" />
      <rect x="0" y="340" width="800" height="160" fill="#7CB342" />

      <!-- sun -->
      <circle cx="110" cy="80" r="40" fill="#FFD54F" />

      <!-- cloud -->
      <ellipse cx="230" cy="90" rx="38" ry="20" fill="#FFFFFF" />
      <ellipse cx="265" cy="95" rx="28" ry="16" fill="#FFFFFF" />

      <!-- tree -->
      <rect x="650" y="330" width="18" height="55" fill="#6D4C32" />
      <circle cx="659" cy="305" r="42" fill="#2E7D32" />

      <!-- house roof -->
      <polygon points="290,230 410,150 530,230" fill="#B33A2E" stroke="#5B4636" stroke-width="2" />

      <!-- house body -->
      <rect x="300" y="230" width="220" height="140" fill="#F3D9A4" stroke="#5B4636" stroke-width="2" />

      <!-- chimney -->
      <rect x="470" y="170" width="26" height="60" fill="#8B5E3C" stroke="#5B4636" stroke-width="2" />

      <!-- door -->
      <rect x="390" y="300" width="44" height="70" fill="#6D4C32" stroke="#3E2C1C" stroke-width="2" />

      <!-- windows -->
      <rect x="325" y="255" width="44" height="44" fill="#BBDEFB" stroke="#3E2C1C" stroke-width="2" />
      <line x1="347" y1="255" x2="347" y2="299" stroke="#3E2C1C" stroke-width="2" />
      <line x1="325" y1="277" x2="369" y2="277" stroke="#3E2C1C" stroke-width="2" />

      <rect x="450" y="255" width="44" height="44" fill="#BBDEFB" stroke="#3E2C1C" stroke-width="2" />
      <line x1="472" y1="255" x2="472" y2="299" stroke="#3E2C1C" stroke-width="2" />
      <line x1="450" y1="277" x2="494" y2="277" stroke="#3E2C1C" stroke-width="2" />

      <!-- picket fence -->
      <polyline points="120,430 120,400 135,385 150,400 150,430 170,430 170,400 185,385 200,400 200,430 220,430 220,400 235,385 250,400 250,430 270,430 270,400 285,385 300,400 300,430"
        fill="none" stroke="#FFFFFF" stroke-width="3" />

      <!-- curved garden path -->
      <path d="M210,430 C250,415 230,390 270,375 C310,360 330,380 390,365"
        fill="none" stroke="#9E9E9E" stroke-width="10" stroke-linecap="round" />

      <!-- caption -->
      <text x="400" y="470" text-anchor="middle" font-size="22" fill="#2E2E2E">Welcome to the House &amp; Garden</text>
    </svg>
    <figcaption>Original scene</figcaption>
  </figure>

  <figure id="scene-annotated-figure">
    <svg id="scene-annotated" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="svgTitleAnnotated svgDescAnnotated">
      <title id="svgTitleAnnotated">House and garden scene, annotated with coordinates</title>
      <desc id="svgDescAnnotated">The same house and garden scene, with one example of each shape type labelled with its SVG coordinate attributes.</desc>

      <!-- sky and grass -->
      <rect x="0" y="0" width="800" height="340" fill="#87CEEB" />
      <rect x="0" y="340" width="800" height="160" fill="#7CB342" />

      <!-- sun -->
      <circle cx="110" cy="80" r="40" fill="#FFD54F" />

      <!-- cloud -->
      <ellipse cx="230" cy="90" rx="38" ry="20" fill="#FFFFFF" />
      <ellipse cx="265" cy="95" rx="28" ry="16" fill="#FFFFFF" />

      <!-- tree -->
      <rect x="650" y="330" width="18" height="55" fill="#6D4C32" />
      <circle cx="659" cy="305" r="42" fill="#2E7D32" />

      <!-- house roof -->
      <polygon points="290,230 410,150 530,230" fill="#B33A2E" stroke="#5B4636" stroke-width="2" />

      <!-- house body -->
      <rect x="300" y="230" width="220" height="140" fill="#F3D9A4" stroke="#5B4636" stroke-width="2" />

      <!-- chimney -->
      <rect x="470" y="170" width="26" height="60" fill="#8B5E3C" stroke="#5B4636" stroke-width="2" />

      <!-- door -->
      <rect x="390" y="300" width="44" height="70" fill="#6D4C32" stroke="#3E2C1C" stroke-width="2" />

      <!-- windows -->
      <rect x="325" y="255" width="44" height="44" fill="#BBDEFB" stroke="#3E2C1C" stroke-width="2" />
      <line x1="347" y1="255" x2="347" y2="299" stroke="#3E2C1C" stroke-width="2" />
      <line x1="325" y1="277" x2="369" y2="277" stroke="#3E2C1C" stroke-width="2" />

      <rect x="450" y="255" width="44" height="44" fill="#BBDEFB" stroke="#3E2C1C" stroke-width="2" />
      <line x1="472" y1="255" x2="472" y2="299" stroke="#3E2C1C" stroke-width="2" />
      <line x1="450" y1="277" x2="494" y2="277" stroke="#3E2C1C" stroke-width="2" />

      <!-- picket fence -->
      <polyline points="120,430 120,400 135,385 150,400 150,430 170,430 170,400 185,385 200,400 200,430 220,430 220,400 235,385 250,400 250,430 270,430 270,400 285,385 300,400 300,430"
        fill="none" stroke="#FFFFFF" stroke-width="3" />

      <!-- curved garden path -->
      <path d="M210,430 C250,415 230,390 270,375 C310,360 330,380 390,365"
        fill="none" stroke="#9E9E9E" stroke-width="10" stroke-linecap="round" />

      <!-- caption -->
      <text x="400" y="470" text-anchor="middle" font-size="22" fill="#2E2E2E">Welcome to the House &amp; Garden</text>

      <!-- Step 2: coordinate annotations, one example per shape type -->
      <g id="annotations">
        <!-- circle: sun -->
        <line x1="138" y1="60" x2="160" y2="30" />
        <text x="162" y="27">circle (cx=110, cy=80, r=40)</text>

        <!-- ellipse: cloud -->
        <line x1="245" y1="72" x2="260" y2="50" />
        <text x="262" y="47">ellipse (cx=230, cy=90, rx=38, ry=20)</text>

        <!-- rect: house body -->
        <line x1="300" y1="230" x2="250" y2="200" />
        <text x="60" y="197">rect (x=300, y=230, w=220, h=140)</text>

        <!-- line: window mullion -->
        <line x1="347" y1="277" x2="200" y2="270" />
        <text x="40" y="267">line (347,255)-&gt;(347,299)</text>

        <!-- polygon: roof -->
        <line x1="410" y1="150" x2="410" y2="110" />
        <text x="330" y="100">polygon (290,230 410,150 530,230)</text>

        <!-- polyline: fence -->
        <line x1="185" y1="400" x2="140" y2="460" />
        <text x="30" y="475">polyline (120,430 120,400 135,385 …)</text>

        <!-- path: garden path -->
        <line x1="270" y1="375" x2="220" y2="440" />
        <text x="130" y="455">path (M210,430 C250,415 …)</text>

        <!-- text: caption -->
        <line x1="470" y1="465" x2="560" y2="450" />
        <text x="562" y="447">text (x=400, y=470)</text>
      </g>
    </svg>
    <figcaption>Annotated scene (Step 2)</figcaption>
  </figure>

  <figure id="scene-adjusted-figure">
    <svg id="scene-adjusted" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="svgTitleAdjusted svgDescAdjusted">
      <title id="svgTitleAdjusted">House and garden scene, customised</title>
      <desc id="svgDescAdjusted">The house and garden scene with repositioned house and tree, higher-contrast colours, a dashed fence, a stone-paved path, a mailbox, and chimney smoke.</desc>

      <!-- sky and grass -->
      <rect x="0" y="0" width="800" height="340" fill="#87CEEB" />
      <rect x="0" y="340" width="800" height="160" fill="#7CB342" />

      <!-- sun -->
      <circle cx="110" cy="80" r="40" fill="#FFD54F" />

      <!-- cloud -->
      <ellipse cx="230" cy="90" rx="38" ry="20" fill="#FFFFFF" />
      <ellipse cx="265" cy="95" rx="28" ry="16" fill="#FFFFFF" />

      <!-- (1) tree nudged right/up with a small transform, for balance against the repositioned house -->
      <g transform="translate(20,-6)">
        <rect x="650" y="330" width="18" height="55" fill="#6D4C32" />
        <circle cx="659" cy="305" r="42" fill="#2E7D32" />
      </g>

      <!-- (1) house nudged left/down with a small transform, instead of large coordinate edits -->
      <g transform="translate(-15,8)">
        <!-- (2) roof: darker fill + thicker stroke for contrast against the sky -->
        <polygon points="290,230 410,150 530,230" fill="#8C2F22" stroke="#4A382A" stroke-width="3" />

        <!-- house body: thicker stroke -->
        <rect x="300" y="230" width="220" height="140" fill="#F3D9A4" stroke="#4A382A" stroke-width="3" />

        <!-- chimney -->
        <rect x="470" y="170" width="26" height="60" fill="#8B5E3C" stroke="#4A382A" stroke-width="2" />

        <!-- door: slightly thicker stroke -->
        <rect x="390" y="300" width="44" height="70" fill="#5A3825" stroke="#2E2015" stroke-width="2.5" />

        <!-- (2) windows: more saturated blue + thinner stroke for variety -->
        <rect x="325" y="255" width="44" height="44" fill="#90CAF9" stroke="#2E2015" stroke-width="1.5" />
        <line x1="347" y1="255" x2="347" y2="299" stroke="#2E2015" stroke-width="1.5" />
        <line x1="325" y1="277" x2="369" y2="277" stroke="#2E2015" stroke-width="1.5" />

        <rect x="450" y="255" width="44" height="44" fill="#90CAF9" stroke="#2E2015" stroke-width="1.5" />
        <line x1="472" y1="255" x2="472" y2="299" stroke="#2E2015" stroke-width="1.5" />
        <line x1="450" y1="277" x2="494" y2="277" stroke="#2E2015" stroke-width="1.5" />
      </g>

      <!-- (3) chimney smoke: three fading ellipse puffs drifting up and to the right -->
      <ellipse cx="468" cy="155" rx="10" ry="7" fill="#CCCCCC" opacity="0.7" />
      <ellipse cx="480" cy="133" rx="14" ry="9" fill="#CCCCCC" opacity="0.5" />
      <ellipse cx="493" cy="108" rx="18" ry="11" fill="#CCCCCC" opacity="0.35" />

      <!-- (2) picket fence: dashed stroke for variety -->
      <polyline points="120,430 120,400 135,385 150,400 150,430 170,430 170,400 185,385 200,400 200,430 220,430 220,400 235,385 250,400 250,430 270,430 270,400 285,385 300,400 300,430"
        fill="none" stroke="#FAFAFA" stroke-width="3" stroke-dasharray="6,4" />

      <!-- (2) garden path: stone-paver look via a dashed stroke -->
      <path d="M210,430 C250,415 230,390 270,375 C310,360 330,380 390,365"
        fill="none" stroke="#8D6E63" stroke-width="12" stroke-linecap="round" stroke-dasharray="18,8" />

      <!-- (3) mailbox: rect post, rounded rect body, polygon roof -->
      <rect x="95" y="378" width="6" height="52" fill="#5B4636" />
      <rect x="78" y="358" width="34" height="20" rx="4" fill="#B71C1C" stroke="#4A382A" stroke-width="1.5" />
      <polygon points="78,358 112,358 95,344" fill="#4A382A" />

      <!-- caption -->
      <text x="400" y="470" text-anchor="middle" font-size="22" fill="#2E2E2E">Welcome to the House &amp; Garden</text>
    </svg>
    <figcaption>Adjusted scene (Step 3)</figcaption>
  </figure>

  <figure id="scene-grouped-figure">
    <svg id="scene-grouped" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="svgTitleGrouped svgDescGrouped">
      <title id="svgTitleGrouped">House and garden scene, windows grouped with &lt;g&gt; and reused with &lt;use&gt;</title>
      <desc id="svgDescGrouped">The original house and garden scene, with the two window rectangles refactored into a single reusable &lt;g&gt; element referenced twice via &lt;use&gt; and positioned with transform="translate(x,y)".</desc>

      <!-- sky and grass -->
      <rect x="0" y="0" width="800" height="340" fill="#87CEEB" />
      <rect x="0" y="340" width="800" height="160" fill="#7CB342" />

      <!-- sun -->
      <circle cx="110" cy="80" r="40" fill="#FFD54F" />

      <!-- cloud -->
      <ellipse cx="230" cy="90" rx="38" ry="20" fill="#FFFFFF" />
      <ellipse cx="265" cy="95" rx="28" ry="16" fill="#FFFFFF" />

      <!-- tree -->
      <rect x="650" y="330" width="18" height="55" fill="#6D4C32" />
      <circle cx="659" cy="305" r="42" fill="#2E7D32" />

      <!-- house roof -->
      <polygon points="290,230 410,150 530,230" fill="#B33A2E" stroke="#5B4636" stroke-width="2" />

      <!-- house body -->
      <rect x="300" y="230" width="220" height="140" fill="#F3D9A4" stroke="#5B4636" stroke-width="2" />

      <!-- chimney -->
      <rect x="470" y="170" width="26" height="60" fill="#8B5E3C" stroke="#5B4636" stroke-width="2" />

      <!-- door -->
      <rect x="390" y="300" width="44" height="70" fill="#6D4C32" stroke="#3E2C1C" stroke-width="2" />

      <!-- Reusable window template, defined once at local origin (0,0).
           Reused below via <use> + translate instead of duplicating the rect/line markup. -->
      <defs>
        <g id="window">
          <rect x="0" y="0" width="35" height="30" fill="#BBDEFB" stroke="#3E2C1C" stroke-width="2" />
          <line x1="17.5" y1="0" x2="17.5" y2="30" stroke="#3E2C1C" stroke-width="2" />
          <line x1="0" y1="15" x2="35" y2="15" stroke="#3E2C1C" stroke-width="2" />
        </g>
      </defs>

      <!-- left window: translated to the same spot as the original left window -->
      <use href="#window" transform="translate(325,255)" />
      <!-- right window: translated to the same spot as the original right window -->
      <use href="#window" transform="translate(450,255)" />

      <!-- picket fence -->
      <polyline points="120,430 120,400 135,385 150,400 150,430 170,430 170,400 185,385 200,400 200,430 220,430 220,400 235,385 250,400 250,430 270,430 270,400 285,385 300,400 300,430"
        fill="none" stroke="#FFFFFF" stroke-width="3" />

      <!-- curved garden path -->
      <path d="M210,430 C250,415 230,390 270,375 C310,360 330,380 390,365"
        fill="none" stroke="#9E9E9E" stroke-width="10" stroke-linecap="round" />

      <!-- caption -->
      <text x="400" y="470" text-anchor="middle" font-size="22" fill="#2E2E2E">Welcome to the House &amp; Garden</text>
    </svg>
    <figcaption>Grouped windows scene (Step 4)</figcaption>
  </figure>
</body>
</html>
